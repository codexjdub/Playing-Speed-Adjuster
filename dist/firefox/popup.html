<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PSA</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 300px; background: var(--card); }
  main { padding: 14px 16px 16px; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 12px; }
  .top img { width: 20px; height: 20px; border-radius: 5px; box-shadow: 0 0 0 1px var(--line); }
  .top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; }
  .saved { margin: 14px -16px -16px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; }
  .saved b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
  <main id="box" hidden>
    <div class="top"><img src="icon.svg" alt=""><span id="site">Playing Speed Adjuster</span></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="actions">
      <button id="act" class="primary" type="button"></button>
      <button id="settings" type="button">Settings</button>
    </div>
    <p id="saved" class="saved" hidden></p>
  </main>
  <script src="saved-time.js"></script>
  <script src="popup.js"></script>
</body>
</html>
